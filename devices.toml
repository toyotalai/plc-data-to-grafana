# =============================================================================
# devices.toml — 採集與上送組態
#
# 這個檔案定義「這一台 gateway 接了什麼」以及「資料往哪裡送」。
# 新增設備、改暫存器、改週期、改 broker，都只改這裡，不動程式碼。
#
# 格式是 TOML。Python 3.11 起 tomllib 是標準函式庫，不需要安裝任何套件。
#
# 兩支程式共用這一個檔案：
#   collect.py   讀 [gateway] 和 [[device]]
#   uploader.py  讀 [gateway].site、[mqtt]，以及 [[device]] 的 device→tag 關係
# 分成兩個檔的話，site 會有兩份然後對不上。
# =============================================================================


[gateway]
# 採集週期（秒）。所有設備共用同一個節拍。
interval = 1.0

# 每輪把所有 tag 讀完之後，一次 commit 進資料庫。
commit_per_cycle = true

# 這一台 gateway 的識別，會出現在 MQTT topic 的第二層。
# 樹莓派 = "pi"，之後老筆電那台 = "acer"。
site = "pi"


# =============================================================================
# MQTT 上送（uploader.py 用）
# =============================================================================
[mqtt]
host = "localhost"
port = 1883

# QoS 1 = at-least-once。可能重複，不會遺漏。
#   重複是下游用 (ts, tag) 去重解得掉的問題，遺漏不是。
qos = 1

# topic 結構：<topic_prefix>/<site>/<device>/<tag>
#   例：plcgw/pi/xymd02/xymd02_temp
# 固定前綴是為了跟 broker 上其他東西隔開。
topic_prefix = "plcgw"

# 多久撈一次未送的資料（秒）。
#   不需要跟採集週期一樣快——Grafana 讀的是本地 SQLite，不等上送。
#   拉長一點也能減少跟 collect.py 的 SQLite 讀寫競爭。
upload_interval = 5.0

# 一次最多送幾列。
#   斷網一小時會積壓 3600 × 3 = 10,800 列，
#   以 500 列 / 5 秒計算，追趕速度 100 列/秒 vs 產生速度 3 列/秒，
#   餘裕 33 倍。這個比值必須大於 1，否則永遠追不上。
batch_size = 500

# 等 QoS 1 的 PUBACK 最多等多久（秒）。
#   publish() 回傳成功只代表排進本地佇列，不代表 broker 收到了。
#   不等 PUBACK 就更新進度的話，斷網時那批資料會永遠不再被送出去。
publish_timeout = 10.0

client_id = "uploader-pi"


# =============================================================================
# 設備一：筆電上的 OpenPLC，走 Modbus TCP over 乙太網路
# =============================================================================
[[device]]
name     = "plc"
protocol = "modbus_tcp"
host     = "192.168.50.1"
port     = 5020

# timeout 0.8 s：階段三沿用的設定。
# retries 0：外層迴圈每秒會再讀一次，不需要函式庫再重試一層。
timeout = 0.8
retries = 0

# 讀失敗之後要不要先 close() 再 connect()。
# TCP 必須做 —— 階段六的「重連從未真的重連」就是漏了這一步：
# 函式庫的 connect() 看到舊的連線物件還在，會直接回傳 True 什麼也不做。
reconnect_on_error = true

  [[device.tag]]
  name     = "counter_value"
  function = 3      # 0x03 Read Holding Registers
  address  = 0
  scale    = 1.0
  signed   = false


# =============================================================================
# 設備二：XY-MD02 溫溼度計，走 Modbus RTU over RS-485
# =============================================================================
[[device]]
name      = "xymd02"
protocol  = "modbus_rtu"
port      = "/dev/ttyUSB0"
baudrate  = 9600
bytesize  = 8
parity    = "N"
stopbits  = 1
device_id = 1     # 從站位址。出廠預設 1，可用 0x06 寫保持暫存器 0x0104 修改。

# timeout 0.3 s：實測正常交易 31 ms，給十倍餘裕。
#   若沿用預設的 timeout=1 + retries=3，單次失敗要 4.005 s，
#   會讓 1 Hz 的迴圈在感測器掉線時掉到 0.25 Hz。
timeout = 0.3
retries = 0

# RTU 不需要重連 —— RS-485 是無狀態的，沒有連線可以半開。
# 實測：拔掉 A 線 10 筆失敗，接回去的下一秒就恢復，零介入。
reconnect_on_error = false

  [[device.tag]]
  name     = "xymd02_temp"
  function = 4      # 0x04 Read Input Registers（量測值）
  address  = 1      # 0x0001
  scale    = 0.1    # 原始值 303 -> 30.3 °C
  signed   = true   # 有號 16 位元。低於 0 °C 回傳二補數，不轉換會讀到 6548.6

  [[device.tag]]
  name     = "xymd02_humi"
  function = 4
  address  = 2      # 0x0002
  scale    = 0.1    # 原始值 668 -> 66.8 %RH
  signed   = false  # 濕度不可能是負的


# =============================================================================
# 附註
# =============================================================================
#
# 功能碼與位址空間（XY-MD02 實測確認）
#   0x04 輸入暫存器 = 量測值（唯讀）
#        0x0001 溫度、0x0002 濕度
#   0x03 保持暫存器 = 設定值（可讀可寫）
#        0x0101 鮑率、0x0102 溫度校正、0x0103 濕度校正、0x0104 裝置位址
#   兩者是**不同的位址空間**，不是同一份資料的兩種讀法。
#
# 目前的簡化
#   每個 tag 各發一次請求。溫度和濕度的暫存器相鄰（1、2），
#   理論上可以合併成一次交易，省下 31 ms 並讓兩者共用同一個時間戳。
#   以 1 Hz 的週期來說差異可忽略，所以先不做。
#
# 資料庫路徑不在這裡設定
#   沿用環境變數 DB_PATH。
#   collect.service 啟動時產生時間戳檔名，並把 current.db 這個符號連結
#   指向它；uploader.py 和 Grafana 都只認 current.db。
#   「換一次設定就換一個檔案」的紀律留在服務層，不讓人在組態裡改掉。
#
# 帳號密碼不在這裡
#   7-C 開放區域網路連線時才需要，而且不會明文寫進進版控的檔案。
